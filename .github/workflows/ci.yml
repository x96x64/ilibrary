name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS Build, Tests, and Formatting
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Report toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Build release products
        run: swift build -c release
      - name: Check formatting
        run: swift format lint --strict --recursive Sources Tests Package.swift scripts
      - name: Run tests
        run: scripts/test.sh
      - name: Test publication guards
        run: python3 -m unittest discover -s packaging -p 'test_*.py'
      - name: Test rebuild probe guards without Music
        run: python3 -m unittest discover -s scripts/validation -p 'test_rebuild_probe.py'
      - name: Build and install packages without publishing
        run: |
          python3 packaging/build.py artifacts/ci-packages
          python3 packaging/verify.py artifacts/ci-packages --version 0.1.0 --commit "$(git rev-parse HEAD)" --install

  linux:
    name: Linux Core and Command Tests
    runs-on: ubuntu-24.04
    container: swift:6.4-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Date tests use historical rules of several time zones.
      - name: Install time zone data and packaging test tools
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tzdata python3
      - name: Report toolchain
        run: swift --version
      - name: Run Core and command tests
        run: swift test --disable-xctest --filter 'MP4CoreTests|FLACCoreTests|CatalogCoreTests|RebuildCoreTests|ilibraryTests'
      - name: Test publication guards
        run: python3 -m unittest discover -s packaging -p 'test_*.py'
      - name: Test rebuild probe guards without Music
        run: python3 -m unittest discover -s scripts/validation -p 'test_rebuild_probe.py'
