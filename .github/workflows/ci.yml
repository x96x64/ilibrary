name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS Build, Tests, and Formatting
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Report toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Build release products
        run: swift build -c release
      - name: Check formatting
        run: swift format lint --strict --recursive Sources Tests Package.swift scripts
      - name: Run tests
        run: scripts/test.sh

  linux:
    name: Linux Core Tests
    runs-on: ubuntu-24.04
    container: swift:6.4-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Date tests use historical rules of several time zones.
      - name: Install time zone data
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tzdata
      - name: Report toolchain
        run: swift --version
      - name: Run Core tests
        run: swift test --disable-xctest --filter 'MP4CoreTests|FLACCoreTests|CatalogCoreTests'
