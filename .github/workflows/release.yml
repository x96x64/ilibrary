name: Publish Reviewed Packages

# No tag or push event releases or publishes anything. Each run names the release and commit explicitly.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vX.Y.Z)
        required: true
      commit:
        description: Full source commit on main
        required: true
      manifest_sha256:
        description: SHA-256 of the release's SHA256SUMS file (not used by release)
        required: false
      publish:
        description: >-
          release builds and creates the GitHub release; describe replaces its description; the others verify it or
          publish its packages
        type: choice
        options: [verify, release, describe, npm, pypi, both]
        default: verify
      notes:
        description: The new description of an existing release, in the common layout (describe only)
        required: false

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    if: inputs.publish == 'release' && github.repository == 'x96x64/ilibrary' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Check that the release is new and its commit is on main
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$COMMIT"
          python3 packaging/check_release.py --new "$TAG" "$COMMIT"
      - name: Build and verify the release files
        env:
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
        run: |
          python3 packaging/build.py artifacts/release
          python3 packaging/verify.py artifacts/release --version "${TAG#v}" --commit "$COMMIT" --install
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
        run: |
          python3 packaging/release_notes.py "${TAG#v}" > artifacts/notes.md
          gh release create "$TAG" --target "$COMMIT" --notes-file artifacts/notes.md \
            --title "iLibrary: $TAG, Catalog-Driven Music Libraries for Apple Music on macOS" artifacts/release/*
          echo "SHA256SUMS digest: $(shasum -a 256 artifacts/release/SHA256SUMS | cut -d ' ' -f 1)" \
            >> "$GITHUB_STEP_SUMMARY"

  describe:
    if: inputs.publish == 'describe' && github.repository == 'x96x64/ilibrary' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Check and replace the description of the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
          NOTES: ${{ inputs.notes }}
        run: |
          python3 packaging/check_release.py "$TAG" "$COMMIT"
          printf '%s\n' "$NOTES" > notes.md
          python3 packaging/release_notes.py --check "${TAG#v}" notes.md
          gh release edit "$TAG" --notes-file notes.md
          gh release view "$TAG" --json body --jq .body > published.md
          python3 packaging/release_notes.py --check "${TAG#v}" published.md

  verify:
    if: >-
      inputs.publish != 'release' && inputs.manifest_sha256 != ''
      && github.repository == 'x96x64/ilibrary' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Verify the approved release and files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
          MANIFEST: ${{ inputs.manifest_sha256 }}
        run: |
          python3 packaging/check_release.py "$TAG" "$COMMIT"
          gh release download "$TAG" --dir dist
          python3 packaging/verify.py dist --version "${TAG#v}" --commit "$COMMIT" --manifest-sha256 "$MANIFEST"

  npm:
    if: inputs.publish == 'npm' || inputs.publish == 'both'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Recheck and publish the reviewed npm package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
          MANIFEST: ${{ inputs.manifest_sha256 }}
        run: |
          python3 packaging/check_release.py "$TAG" "$COMMIT"
          gh release download "$TAG" --dir dist
          python3 packaging/verify.py dist --version "${TAG#v}" --commit "$COMMIT" --manifest-sha256 "$MANIFEST"
          npm publish "./dist/x96_64-ilibrary-${TAG#v}.tgz" --access public --provenance --tag latest

  pypi:
    if: inputs.publish == 'pypi' || inputs.publish == 'both'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Recheck and select the reviewed wheel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
          MANIFEST: ${{ inputs.manifest_sha256 }}
        run: |
          python3 packaging/check_release.py "$TAG" "$COMMIT"
          gh release download "$TAG" --dir dist
          python3 packaging/verify.py dist --version "${TAG#v}" --commit "$COMMIT" --manifest-sha256 "$MANIFEST"
          mkdir wheelhouse
          cp "dist/x96_64_ilibrary-${TAG#v}-py3-none-macosx_14_0_arm64.whl" wheelhouse/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: wheelhouse/
